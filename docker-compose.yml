services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: foosball
      POSTGRES_PASSWORD: foosball
      POSTGRES_DB: foosball
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - videos:/app/data/videos
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
      - videos:/app/data/videos
    env_file: .env
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  videos:
